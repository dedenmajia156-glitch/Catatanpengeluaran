<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategori · Keuangan Keluarga</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">

  <div id="sidebar-mount"></div>

  <main class="main-content">
    <div class="page-header">
      <h1>🏷️ <span>Kategori</span></h1>
      <button class="btn-add" onclick="openModal()">＋ Tambah Kategori</button>
    </div>

    <!-- Tabs -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabIncome" onclick="setTab('income')"><span class="lbl-dot income" style="vertical-align:middle"></span>Pemasukan</button>
      <button class="tab-btn" id="tabExpense" onclick="setTab('expense')"><span class="lbl-dot expense" style="vertical-align:middle"></span>Pengeluaran</button>
    </div>

    <!-- Category Grid -->
    <div class="cat-grid" id="catGrid">
      <div class="loading" style="grid-column:1/-1">Memuat...</div>
    </div>
  </main>
</div>

<div id="bnav-mount"></div>

<!-- Add Category Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Tambah Kategori</div>
    <div class="modal-body">
      <div class="type-toggle">
        <button class="type-btn active-income" id="btnIncome" onclick="setCatType('income')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:middle"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>Pemasukan</button>
        <button class="type-btn" id="btnExpense" onclick="setCatType('expense')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:5px;vertical-align:middle"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>Pengeluaran</button>
      </div>
      <div class="form-group">
        <label class="form-label">Emoji / Icon</label>
        <input type="text" class="form-input" id="fIcon" placeholder="📌" maxlength="4" style="text-align:center;font-size:24px;">
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">Contoh: 🎯 🛍️ 🎓 💊 ✈️ 🎸 🏋️</div>
      </div>
      <div class="form-group">
        <label class="form-label">Nama Kategori *</label>
        <input type="text" class="form-input" id="fName" placeholder="Nama kategori...">
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" id="btnSave" onclick="saveCategory()">Simpan</button>
      </div>
    </div>
  </div>
</div>

<div class="snackbar" id="snackbar"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/nav.js"></script>
<script>
  checkAuth();
  initNav('categories');

  let activeTab = 'income';
  let newCatType = 'income';
  let categories = [];

  loadCategories();

  async function loadCategories() {
    const { data } = await db.from('kk_categories').select('*').order('is_preset',{ascending:false}).order('name');
    categories = data || [];
    renderGrid();
  }

  function setTab(type) {
    activeTab = type;
    document.getElementById('tabIncome').className = 'tab-btn'+(type==='income'?' active':'');
    document.getElementById('tabExpense').className = 'tab-btn'+(type==='expense'?' active':'');
    renderGrid();
  }

  function renderGrid() {
    const el = document.getElementById('catGrid');
    const list = categories.filter(c=>c.type===activeTab);
    if (!list.length) { el.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="ei">🏷️</div><p>Belum ada kategori</p></div>'; return; }
    el.innerHTML = list.map(c => `
      <div class="cat-item">
        <div class="cat-icon-box ${c.type}">${c.icon||'📌'}</div>
        <div class="cat-name">${c.name}</div>
        ${c.is_preset
          ? '<span class="badge-preset">Preset</span>'
          : `<button class="btn-del-sm" onclick="deleteCategory('${c.id}','${c.name.replace(/'/g,"\\'")}')">Hapus</button>`}
      </div>`).join('');
  }

  function setCatType(type) {
    newCatType = type;
    document.getElementById('btnIncome').className = 'type-btn'+(type==='income'?' active-income':'');
    document.getElementById('btnExpense').className = 'type-btn'+(type==='expense'?' active-expense':'');
  }

  function openModal() {
    document.getElementById('fIcon').value = '';
    document.getElementById('fName').value = '';
    setCatType(activeTab);
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }

  async function saveCategory() {
    const name = document.getElementById('fName').value.trim();
    const icon = document.getElementById('fIcon').value.trim() || '📌';
    if (!name) { showSnack('⚠️ Nama kategori wajib diisi'); return; }
    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Menyimpan...';
    const { error } = await db.from('kk_categories').insert({ name, type: newCatType, icon, is_preset: false });
    btn.disabled = false; btn.textContent = 'Simpan';
    if (error) { showSnack('❌ '+error.message); return; }
    closeModal(); showSnack('✅ Kategori ditambahkan!');
    setTab(newCatType);
    loadCategories();
  }

  async function deleteCategory(id, name) {
    if (!confirm(`Hapus kategori "${name}"?`)) return;
    const { error } = await db.from('kk_categories').delete().eq('id',id);
    if (error) { showSnack('❌ '+error.message); return; }
    showSnack('🗑️ Dihapus'); loadCategories();
  }

  function showSnack(msg) {
    const el = document.getElementById('snackbar');
    el.textContent = msg; el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),2800);
  }
</script>
</body>
</html>
